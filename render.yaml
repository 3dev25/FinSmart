databases:
  - name: finsmart-db
    databaseName: finsmart
    user: finsmart
    plan: free
    region: frankfurt
services:
  - type: worker
    name: finsmart-bot
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finsmart-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
